<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gradSchool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="94" fill="#ffffff" stroke="#1e293b" stroke-width="6"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="100" cy="100" r="76" fill="url(#gradSchool)"/>
  
  <!-- Text on ring path -->
  <path id="textCircle" d="M 28 100 A 72 72 0 1 1 172 100" fill="none"/>
  
  <!-- Center elements -->
  <circle cx="100" cy="100" r="54" fill="#ffffff" stroke="#fbbf24" stroke-width="3"/>
  
  <!-- Open Book -->
  <path d="M 72 110 Q 86 102 100 106 Q 114 102 128 110 L 128 126 Q 114 118 100 122 Q 86 118 72 126 Z" fill="#1e293b"/>
  <line x1="100" y1="106" x2="100" y2="122" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Flaming Torch of Knowledge -->
  <path d="M 97 98 L 103 98 L 101 110 L 99 110 Z" fill="#78350f"/>
  <path d="M 100 74 C 92 84 94 92 100 96 C 106 92 108 84 100 74 Z" fill="url(#goldGrad)"/>
  <circle cx="100" cy="88" r="4" fill="#ef4444"/>

  <!-- Stars -->
  <polygon points="100,56 102,62 108,62 103,66 105,72 100,68 95,72 97,66 92,62 98,62" fill="#fbbf24"/>
  <polygon points="70,95 71,98 75,98 72,100 73,104 70,102 67,104 68,100 65,98 69,98" fill="#fbbf24"/>
  <polygon points="130,95 131,98 135,98 132,100 133,104 130,102 127,104 128,100 125,98 129,98" fill="#fbbf24"/>
  
  <!-- Banner ESTD 1995 -->
  <rect x="70" y="138" width="60" height="18" rx="9" fill="#1e293b"/>
  <text x="100" y="151" font-size="10" font-family="'Inter', sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">ESTD 1995</text>
  
  <!-- School Name Arch text -->
  <text font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1">
    <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
      XYZ SCHOOL &amp; COLLEGE
    </textPath>
  </text>
